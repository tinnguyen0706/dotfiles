config_version = 8

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.81999998167157173
    border = "tertiary"
    border_width = 1.0
    center = [ "cat_3", "workspaces", "cat_2" ]
    end = [ "privacy", "tray", "group:g1", "control-center", "clock", "notifications" ]
    margin_edge = 0
    margin_ends = 0
    shadow = false
    start = [ "launcher", "active_window", "media" ]
    thickness = 25

        [[bar.default.capsule_group]]
        enabled = true
        fill = "on_primary"
        id = "g1"
        members = [ "network", "bluetooth", "battery" ]
        opacity = 1.0
        padding = 6.0


[calendar]
enabled = true

    [calendar.account.tinhiem]
    type = "google"

[control_center]
hidden_tabs = [ "power" ]
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

