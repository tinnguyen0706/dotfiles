# Colors - Catppuccin Latte
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}.sock
dynamic_background_opacity yes
auto_reload_config 0.1
background_opacity 0.70
# Runtime override generated by system-profile.py.
include ~/.local/state/system-profile/kitty.conf
font_size 12.0
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
hide_window_decorations yes
window_padding_width        10

# The basic colors
foreground            #e5e1e9
background            #131318
cursor                #e5e1e9

# Black
color0                #d3d0d9
color8                #d3d0d9

# Red
color1                #f6c5cf
color9                #efc8ce

# Green
color2                #aadfa4
color10               #aadfa4

# Yellow
color3                #edcca1
color11               #edcca1

# Blue
color4                #c1d2f3
color12               #b9d4f1

# Magenta
color5                #e8c8e1
color13               #e8c8e1

# Cyan
color6                #8ddfe8
color14               #8ddfe8

# White
color7                #d3d0d9
color15               #d3d0d9
