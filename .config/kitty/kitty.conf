# Colors - Catppuccin Latte
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}.sock
auto_reload_config 0.1
background_opacity 0.70
font_size 12.0
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
hide_window_decorations yes
window_padding_width        10

# The basic colors
foreground            #e5e1e9
background            #131318
cursor                #e5e1e9

# Black
color0                #d3d0d9
color8                #d3d0d9

# Red
color1                #f5c5d1
color9                #eec8d0

# Green
color2                #afddac
color10               #afddac

# Yellow
color3                #ebcda8
color11               #ebcda8

# Blue
color4                #c2d2f3
color12               #bbd4f1

# Magenta
color5                #e8c8e2
color13               #e8c8e2

# Cyan
color6                #98dde8
color14               #98dde8

# White
color7                #d3d0d9
color15               #d3d0d9
